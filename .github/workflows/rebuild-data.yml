name: Ververs muurschilderingen-data

on:
  workflow_dispatch: {}
  schedule:
    # 1x per maand, de brondatabase groeit incrementeel, niet dagelijks
    - cron: "17 3 1 * *"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/fetch.py

      - name: Commit gewijzigde data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw docs/data/site
          git diff --cached --quiet && echo "geen wijzigingen" && exit 0
          git commit -m "chore: ververs muurschilderingen-data ($(date -u +%Y-%m-%d))"
          git push
